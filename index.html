<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chaos-Lite Engine</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app" class="container">
    
    <!-- HEADER & ACTIVE METERS -->
    <header class="card">
      <h2>Chaos-Lite Dashboard</h2>
      <div class="meter-grid">
        <div class="meter-box">
          <label>Control (0–6)</label>
          <div class="meter-controls">
            <button id="btn-control-minus" type="button">-</button>
            <span id="control-val">6</span>
            <button id="btn-control-plus" type="button">+</button>
          </div>
        </div>
        <div class="meter-box">
          <label>Essence (0–6)</label>
          <div class="meter-controls">
            <button id="btn-essence-minus" type="button">-</button>
            <span id="essence-val">2</span>
            <button id="btn-essence-plus" type="button">+</button>
          </div>
        </div>
      </div>
    </header>

    <!-- OUTPUT DIRECTIVE BOX -->
    <section class="card output-card">
      <label for="directive-output">Generated AI Directive</label>
      <textarea id="directive-output" readonly placeholder="Directives will appear here..."></textarea>
      <div class="output-actions">
        <button id="btn-copy-directive" class="btn-primary" type="button">Copy</button>
        <button id="btn-undo-directive" class="btn-secondary" type="button" disabled>Undo</button>
        <button id="btn-redo-directive" class="btn-secondary" type="button" disabled>Redo</button>
        <button id="btn-clear-directive" class="btn-secondary" type="button">Clear</button>
        <span id="copy-feedback" class="feedback-text">Copied!</span>
      </div>
    </section>

    <!-- COLLAPSIBLE: ACTION MOVES -->
    <details class="card">
      <summary>Action Moves</summary>
      <div class="section-body">
        
        <!-- MOVE TYPE SELECT -->
        <div class="form-group">
          <label for="move-select">Move Type</label>
          <select id="move-select"></select>
        </div>
        
        <!-- DIFFICULTY & EXPERIENCE (2-COLUMN ROW) -->
        <div class="form-row">
          <div class="form-group">
            <label for="diff-select">Difficulty</label>
            <select id="diff-select"></select>
          </div>

          <div class="form-group">
            <label for="exp-select">Experience</label>
            <select id="exp-select">
              <option value="none">-- None (+0) --</option>
            </select>
          </div>
        </div>

        <!-- ROLL BUTTON & READOUT (VERTICAL STACK) -->
        <button id="btn-roll-move" class="btn-action" type="button">Roll Move</button>
        <div id="roll-results" class="roll-readout">Select a move and roll...</div>

      </div>
    </details>

    <!-- COLLAPSIBLE: EXPERIENCES -->
    <details class="card">
      <summary>Experiences</summary>
      <div class="section-body">
        
        <!-- ADD EXPERIENCE FORM -->
        <div class="form-row">
          <input type="text" id="exp-name-input" placeholder="e.g., Lockpicking, Noble Etiquette..." style="flex: 1; background: #16191e; border: 1px solid var(--card-border); color: var(--text-main); padding: 8px; border-radius: 6px; font-size: 0.9rem;" />
          <button id="btn-add-exp" class="btn-secondary" type="button">+ Add</button>
        </div>

        <!-- DYNAMIC EXPERIENCES LIST -->
        <div id="experiences-list" class="experiences-list" style="display: flex; flex-direction: column; gap: 6px; margin-top: 10px;">
          <!-- Rendered dynamically -->
        </div>

      </div>
    </details>

    <!-- COLLAPSIBLE: ORACLES & GENERATORS -->
    <details class="card">
      <summary>Oracles & Generators</summary>
      <div class="section-body">
        
        <!-- ACTION / THEME ORACLE -->
        <div class="oracle-group">
          <label>Action & Theme Oracle</label>
          <button id="btn-oracle-action-theme" class="btn-secondary full-width" type="button">Generate Action / Theme Directive</button>
        </div>

        <!-- LEAD GENERATOR -->
        <div class="oracle-group">
          <label for="lead-target-select">Lead Target</label>
          <div class="form-row">
            <select id="lead-target-select">
              <option value="random">Random (Character or Location)</option>
              <option value="character">Character Only</option>
              <option value="location">Location Only</option>
            </select>
            <button id="btn-generate-lead" class="btn-secondary" type="button">Generate Lead</button>
          </div>
        </div>

        <!-- VECTOR GENERATORS -->
        <div class="oracle-group">
          <label>Quick Vectors</label>
          <div class="button-row">
            <button id="btn-vector-clue" class="btn-secondary" type="button">+ Clue</button>
            <button id="btn-vector-opportunity" class="btn-secondary" type="button">+ Opportunity</button>
            <button id="btn-vector-complication" class="btn-secondary" type="button">+ Complication</button>
          </div>
        </div>

      </div>
    </details>

    <!-- COLLAPSIBLE: PROGRESS & THREAT TRACKS -->
    <details class="card">
      <summary>Progress & Threat Tracks</summary>
      <div class="section-body">
        
        <!-- DYNAMIC TRACKS CONTAINER (TOP) -->
        <div id="tracks-list" class="tracks-list">
          <!-- Rendered dynamically -->
        </div>

        <!-- CREATE TRACK FORM (BOTTOM) -->
        <div class="track-create-form">
          <div class="form-group">
            <label for="track-name-input">Track Description</label>
            <input type="text" id="track-name-input" placeholder="e.g., Find the Monstrance..." />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="track-type-select">Type</label>
              <select id="track-type-select">
                <option value="objective">Objective</option>
                <option value="threat">Threat</option>
              </select>
            </div>
            <div class="form-group">
              <label for="track-size-select">Segments</label>
              <select id="track-size-select">
                <option value="4">4 Segments</option>
                <option value="6" selected>6 Segments</option>
                <option value="8">8 Segments</option>
              </select>
            </div>
            <button id="btn-create-track" class="btn-secondary" type="button" style="align-self: flex-end;">+ Add Track</button>
          </div>
        </div>

      </div>
    </details>

    <!-- COLLAPSIBLE: SYSTEM & DATA -->
    <details class="card">
      <summary>System & Data</summary>
      <div class="section-body">
        <div class="button-row">
          <button id="btn-export-state" class="btn-secondary" type="button">Export State (.json)</button>
          <button id="btn-import-trigger" class="btn-secondary" type="button">Import State</button>
          <input type="file" id="input-import-file" accept=".json" style="display: none;" />
        </div>
        <div style="margin-top: 8px;">
          <button id="btn-reset-state" class="btn-secondary full-width" type="button" style="color: #bf616a;">Reset Session</button>
        </div>
      </div>
    </details>

  </div>

  <!-- 1. DATA FILES -->
  <script src="./src/data/characters.js"></script>
  <script src="./src/data/locations.js"></script>
  <script src="./src/data/moves.js"></script>
  <script src="./src/data/tables.js"></script>
  <script src="./src/data/vectors.js"></script>

  <!-- 2. ENGINE MODULES -->
  <script src="./src/engine/state.js"></script>
  <script src="./src/engine/generators.js"></script>
  <script src="./src/engine/directives.js"></script>

  <!-- 3. UI CONTROLLER -->
  <script src="./src/app.js"></script>
  
</body>
</html>
